<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEARCH SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400&family=Orbitron:wght@500&display=swap" rel="stylesheet">
<style>
:root{--c:#00d4ff;--red:#ff1a1a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Orbitron,"Segoe UI",sans-serif;color:var(--c);-webkit-user-select:none;user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) contrast(1.1) saturate(.85);opacity:0;pointer-events:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#cv{display:none}
.fx{position:fixed;inset:0;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%),
repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
header{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;
padding:max(4vh,env(safe-area-inset-top)) 2.3vw 0;font-size:clamp(12px,1.5vw,40px);letter-spacing:.04em;text-shadow:0 0 10px rgba(0,212,255,.7)}
#log{position:fixed;left:2.3vw;bottom:max(3vh,env(safe-area-inset-bottom));font:400 clamp(11px,1.1vw,30px)/1.75 'Exo 2','Segoe UI',sans-serif;text-shadow:0 0 8px rgba(0,212,255,.6)}
#log div{animation:in .25s ease-out}
#log .red{color:var(--red);text-shadow:0 0 8px rgba(255,26,26,.7)}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
#hint{position:fixed;right:2.3vw;bottom:max(3vh,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#hint .row{display:flex;gap:10px}
#hint button{font:inherit;font-size:clamp(10px,1.4vw,16px);color:var(--c);background:rgba(0,20,30,.45);border:1px solid var(--c);padding:10px 14px;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hint button.on{background:rgba(0,212,255,.3);box-shadow:0 0 12px rgba(0,212,255,.7)}
@media (prefers-reduced-motion:reduce){#log div{animation:none}}
.gog #hint,.gog .fx{display:none}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="gl"></canvas><canvas id="cv"></canvas>
<div class="fx"></div>
<div id="hint"><div class="row"><button id="bp">PERSON [SPACE]</button><button id="bb">BOOK [B]</button><button id="bc">CAMERA [C]</button><button id="bg">GOGGLE [G]</button></div><div class="row"><button id="u1">UI −</button><button id="u2">UI +</button><button id="t1">TEXT −</button><button id="t2">TEXT +</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id);
const video=$('v'),cv=$('cv'),ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mk=()=>document.createElement('canvas');
const sc=mk(),fc=mk(),oc=mk(),scc=mk(),ec=mk(),rc=mk(),hc=mk(),hctx=hc.getContext('2d');  // silhouette(mask res), fill, outline, scan layer (screen res)
let goggle=false,gDepth=.004,gSep=0,uiS=1,txS=1,EW=0,EH=0,HW=0,HH=0,W=0,H=0,state=0,mode='none',books=[],cocoModel=null,loading=false; // state: 0 boot, 1 ready, 2 scanning
let bbox=null,rect=null,scanT0=0,busy=false,seg=null,ready=false;
let scanEndT=0,cardT0=0,labelT0=0,cardCur=null,lastRel=0,rf=0,lastPerson=0,cuVis=false,cuT0=0,scanned=false;
const LENS_K=0.10,CA=0.025,GOG_K=0,GOG_CA=0.012,GOG_FIT=.92;   // GOG_FIT: size of the 16:9 UI area inside each eye view (1 = as large as fits)   // GOG_*: values used in goggle mode (lenses add their own distortion)   // pincushion strength / chromatic aberration (both grow toward the screen edge)
const CYAN='0,212,255';

const logs=[];
function log(t,red){logs.push({t:'[System] '+t,red,b:performance.now()});if(logs.length>13)logs.shift()}
try{document.fonts.load("500 20px Orbitron");document.fonts.load("400 20px 'Exo 2'")}catch(e){}
try{const o=JSON.parse(localStorage.getItem('ss')||'{}');if(o.gDepth!=null)gDepth=o.gDepth;if(o.gSep!=null)gSep=o.gSep;if(o.uiS!=null)uiS=o.uiS;if(o.txS!=null)txS=o.txS}catch(e){}
function drawHud(now){      // header + log, laid out so that nothing overlaps whatever the UI / text size is
  const W=HW,H=HH,c=hctx,g=goggle,k=g?1.6:1;
  let fs=Math.max(12,W*.015*k)*txS,lf=Math.max(11,W*.011*k)*txS;
  const px=W*(g?.04:.023),top=H*(g?.07:.04),bot=H*(g?.07:.03),room=W-2*px;
  const n=new Date(),p2=x=>String(x).padStart(2,'0');
  const ds=`${n.getFullYear()}.${p2(n.getMonth()+1)}.${p2(n.getDate())}  ${p2(n.getHours())}:${p2(n.getMinutes())}`;
  const HF=f=>`500 ${f}px Orbitron,'Segoe UI',sans-serif`,LF=f=>`400 ${f}px 'Exo 2','Segoe UI',sans-serif`;
  c.save();
  c.font=HF(fs);                                   // title and date must fit on one line
  const need=c.measureText('SEARCH SYSTEM').width+c.measureText(ds).width+fs*1.5;
  if(need>room)fs=Math.max(6,fs*room/need);
  c.font=LF(lf);                                   // every log line must fit the width
  let mw=0;logs.forEach(l=>{mw=Math.max(mw,c.measureText(l.t).width)});
  if(mw>room)lf=Math.max(6,lf*room/mw);
  const lh=lf*1.75,free=H-bot-(top+fs*1.3)-lf;     // height left between the header and the bottom margin
  const lines=logs.slice(logs.length-Math.max(0,Math.floor(free/lh)));   // keep only the newest lines that fit
  c.shadowColor='rgba(0,212,255,.7)';c.shadowBlur=10;c.fillStyle=`rgb(${CYAN})`;c.textBaseline='top';
  c.font=HF(fs);c.textAlign='left';c.fillText('SEARCH SYSTEM',px,top);c.textAlign='right';c.fillText(ds,W-px,top);
  c.textAlign='left';c.textBaseline='alphabetic';c.font=LF(lf);
  lines.forEach((l,i)=>{
    const t=Math.min(1,(now-l.b)/250),y=H-bot-(lines.length-1-i)*lh;
    c.globalAlpha=t;c.fillStyle=l.red?'#ff1a1a':`rgb(${CYAN})`;c.shadowColor=l.red?'rgba(255,26,26,.7)':'rgba(0,212,255,.6)';
    c.fillText(l.t,px-(1-t)*8,y);
  });
  c.restore();
}
function resize(){
  const iw=innerWidth,ih=innerHeight,fit=goggle?GOG_FIT:1;
  EW=goggle?Math.floor(iw/2):iw;EH=ih;
  W=EW;H=EH;                                   // camera video + object markers: the whole (eye) view
  const base=Math.min(EW,EH*16/9)*fit*uiS;     // HUD (header, log, centre UI): a 16:9 area in the middle, scaled by uiS
  HW=Math.max(64,Math.floor(base));HH=Math.max(36,Math.floor(HW*9/16));
  cv.width=W;cv.height=H;hc.width=HW;hc.height=HH;
  $('gl').width=goggle?EW*2:W;$('gl').height=EH;
  [fc,oc,scc,ec].forEach(c=>{c.width=W;c.height=H});
}
addEventListener('resize',resize);resize();

function coverRect(){
  const vw=video.videoWidth||16,vh=video.videoHeight||9,s=Math.max(W/vw,H/vh);
  return {x:(W-vw*s)/2,y:(H-vh*s)/2,w:vw*s,h:vh*s};
}

// ---------- segmentation result -> silhouette, outline ----------
function onResults(r){
  const m=r.segmentationMask,mw=m.width,mh=m.height;
  const tmp=onResults.t||(onResults.t=mk());tmp.width=mw;tmp.height=mh;
  const tc=tmp.getContext('2d',{willReadFrequently:true});
  tc.clearRect(0,0,mw,mh);tc.drawImage(m,0,0,mw,mh);
  const src=tc.getImageData(0,0,mw,mh),out=tc.createImageData(mw,mh);
  let x0=mw,y0=mh,x1=0,y1=0,n=0;
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){
    const i=(y*mw+x)*4;
    if(src.data[i+3]>140){
      out.data[i]=0;out.data[i+1]=212;out.data[i+2]=255;out.data[i+3]=255;
      n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    }
  }
  sc.width=mw;sc.height=mh;sc.getContext('2d').putImageData(out,0,0);
  rect=coverRect();
  if(n<mw*mh*0.02){bbox=null;oc.getContext('2d').clearRect(0,0,W,H);return}
  bbox={x0:rect.x+x0/mw*rect.w,x1:rect.x+x1/mw*rect.w,y0:rect.y+y0/mh*rect.h,y1:rect.y+y1/mh*rect.h};lastPerson=performance.now();
  const f=fc.getContext('2d');f.clearRect(0,0,W,H);f.imageSmoothingEnabled=true;
  f.drawImage(sc,rect.x,rect.y,rect.w,rect.h);
  const o=oc.getContext('2d');o.clearRect(0,0,W,H);o.globalCompositeOperation='source-over';
  const t=3;
  for(let a=0;a<8;a++){o.drawImage(fc,Math.cos(a*Math.PI/4)*t,Math.sin(a*Math.PI/4)*t)}
  o.globalCompositeOperation='destination-out';o.drawImage(fc,0,0);o.globalCompositeOperation='source-over';
}

// ---------- render ----------
function reticle(){
  const cx=(bbox.x0+bbox.x1)/2,cy=bbox.y0+(bbox.y1-bbox.y0)*.72,s=Math.max(24,(bbox.x1-bbox.x0)*.16);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();
  const k=s*.28;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{
    const px=cx+a*s,py=cy+b*s;ctx.moveTo(px-a*k,py);ctx.lineTo(px,py);ctx.lineTo(px,py-b*k);});
  ctx.moveTo(cx+s+8,cy+s);ctx.lineTo(cx+s*4,cy+s);ctx.lineTo(cx+s*5.2,cy-s*.2);ctx.stroke();
}
const scanP=now=>Math.min(Math.max((now-scanT0)/3200,0),1);
const NZ=Uint8Array.from({length:65536},()=>Math.random()*256);

// ---- relief ("emboss") effect: directional derivative of the video, coloured green / cyan on a blue base ----
function updateRelief(now){
  if(now-lastRel<66)return;lastRel=now;
  const rw=400,rh=Math.max(2,Math.round(rw*H/W)),N=rw*rh;
  if(rc.width!==rw||rc.height!==rh){rc.width=rw;rc.height=rh}
  const r=coverRect(),k=rw/W,x=rc.getContext('2d',{willReadFrequently:true});
  x.drawImage(video,r.x*k,r.y*k,r.w*k,r.h*k);
  const im=x.getImageData(0,0,rw,rh),d=im.data,g=new Float32Array(N);
  for(let i=0;i<N;i++)g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  rf=(rf+9973)&65535;
  for(let i=0;i<N;i++){
    const e=g[Math.min(i+rw+1,N-1)]-g[Math.max(i-rw-1,0)]+(NZ[(i*13+rf)&65535]-128)*.15,o=i*4;
    if(e>12){d[o]=110;d[o+1]=255;d[o+2]=110;d[o+3]=235}
    else if(e<-12){d[o]=0;d[o+1]=225;d[o+2]=255;d[o+3]=235}
    else{d[o]=0;d[o+1]=35;d[o+2]=120;d[o+3]=150}
  }
  x.putImageData(im,0,0);
  const c=ec.getContext('2d');c.globalCompositeOperation='source-over';c.clearRect(0,0,W,H);
  c.imageSmoothingEnabled=false;c.drawImage(rc,0,0,W,H);
  c.globalCompositeOperation='destination-in';c.drawImage(fc,0,0);c.globalCompositeOperation='source-over';
}

// ---- centre UI: shape never changes; low-opacity cyan fills in bright from both sides as p goes 0 -> 1 ----
function drawCenterUI(p,a){const ctx=hctx,W=HW,H=HH;
  const cx=W/2,cy=H/2,R=Math.min(H*.082,W*.14),r=R*.41,hs=55*Math.PI/180,col='rgb(70,222,235)';
  const path=()=>{
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.moveTo(cx-r*Math.cos(hs),cy+r*Math.sin(hs));ctx.arc(cx,cy,r,Math.PI-hs,Math.PI+hs);
    ctx.moveTo(cx+r*Math.cos(hs),cy-r*Math.sin(hs));ctx.arc(cx,cy,r,-hs,hs);
    [-1,1].forEach(s=>{
      ctx.moveTo(cx+s*R*1.15,cy-R*.42);ctx.lineTo(cx+s*R*1.15,cy+R*.42);
      ctx.moveTo(cx+s*R*1.33,cy-R*.24);ctx.lineTo(cx+s*R*1.33,cy+R*.24);
      ctx.moveTo(cx+s*R*1.15,cy);ctx.lineTo(cx+s*R*1.55,cy);
    });
  };
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=R*.05;
  ctx.globalAlpha=a*.3;path();ctx.stroke();
  const wd=R*1.6*(1-p);                       // un-filled band around the vertical centre line
  ctx.beginPath();ctx.rect(0,0,Math.max(0,cx-wd),H);ctx.rect(cx+wd,0,W,H);ctx.clip();
  ctx.globalAlpha=a;ctx.shadowColor=col;ctx.shadowBlur=12;path();ctx.stroke();
  ctx.restore();
}
function centerUI(now){
  let on=false,p=0,a=1;
  if(mode==='person'){on=state>=1&&now-lastPerson<600;p=scanEndT?1:(state===2?scanP(now):0)}
  else if(mode==='book'&&state===2){on=true;p=scanEndT?1:scanP(now);if(scanEndT)a=Math.max(0,1-(now-scanEndT)/500)}
  if(!on){cuVis=false;return}
  if(!cuVis){cuVis=true;cuT0=now}
  a*=Math.min(1,(now-cuT0)/250);
  if(a>0)drawCenterUI(p,a);
}

// ---- white square brackets + leader line + label (la: label opacity 0..1) ----
function drawMarker(cx,cy,S,lab,a,la){
  const x0=cx-S/2,y0=cy-S/2,x1=cx+S/2,y1=cy+S/2,ar=S*.11,u=Math.max(S,160)/255*uiS;
  ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,2.5*u);ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.beginPath();
  [[x0,y0,1,1],[x1,y0,-1,1],[x1,y1,-1,-1],[x0,y1,1,-1]].forEach(([x,y,p,q])=>{ctx.moveTo(x+p*ar,y);ctx.lineTo(x,y);ctx.lineTo(x,y+q*ar)});
  ctx.stroke();
  if(la>0){
    ctx.globalAlpha=a*la;
    const px=x1+203*u,ex=px+98*u,ey=cy-98*u,fs=Math.max(12,Math.min(40,28*u))*txS;
    ctx.beginPath();ctx.moveTo(x1,cy);ctx.lineTo(px,cy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.font=`500 ${fs}px Orbitron,sans-serif`;ctx.fillStyle='#fff';
    const tw=ctx.measureText(lab).width;
    ctx.fillText(lab,Math.max(8,Math.min(W-tw-8,ex-tw/2)),Math.max(fs+4,ey-24*u));
  }
  ctx.restore();
}

// ---- person scan: relief effect revealed top->bottom; ID card marker stays until the person leaves the camera ----
function drawPersonScan(now){
  const bw=bbox.x1-bbox.x0,bh=bbox.y1-bbox.y0;
  if(state===2){
    const p=scanP(now),ly=bbox.y0+bh*p,fade=scanEndT?Math.max(0,1-(now-scanEndT)/600):1;
    if(fade>0){
      updateRelief(now);
      ctx.save();ctx.globalAlpha=fade;ctx.beginPath();ctx.rect(0,0,W,ly);ctx.clip();ctx.drawImage(ec,0,0);ctx.restore();
      if(p<1){ctx.save();ctx.strokeStyle='#bff';ctx.shadowColor=`rgb(${CYAN})`;ctx.shadowBlur=16;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(bbox.x0-30,ly);ctx.lineTo(bbox.x1+30,ly);ctx.stroke();ctx.restore()}
    }
  }
  if(!cardT0)return;
  const ch=Math.min(H*.14,Math.max(H*.05,bh*.09)),cw=ch/1.6,n={cx:bbox.x0+bw*.58,cy:bbox.y0+bh*.36,S:ch*1.5};
  if(!cardCur)cardCur=n;else for(const k in n)cardCur[k]+=(n[k]-cardCur[k])*.3;
  const t=Math.min(1,(now-cardT0)/400),S=cardCur.S*(1+(1-t)*.8);
  ctx.save();ctx.globalAlpha=t;ctx.translate(cardCur.cx,cardCur.cy);ctx.rotate(.05);
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.strokeRect(-cw/2,-ch/2,cw,ch);ctx.restore();
  drawMarker(cardCur.cx,cardCur.cy,S,'MISSION TARGET',t,labelT0?Math.min(1,(now-labelT0)/300):0);
}
function render(now){
  ctx.clearRect(0,0,W,H);hctx.clearRect(0,0,W,H);
  if(mode==='book'&&state>=1)drawBooks(now);
  if(mode==='person'){
    if(cardT0&&state!==2&&now-lastPerson>600){cardT0=labelT0=0;cardCur=null;scanEndT=0}   // person left the camera
    if(state>=1&&bbox){
      ctx.save();ctx.shadowColor=`rgb(${CYAN})`;ctx.shadowBlur=12;ctx.drawImage(oc,0,0);ctx.restore();
      if(state===2||cardT0)drawPersonScan(now);else if(!scanned)reticle();
    }
  }
  centerUI(now);drawHud(now);
  if(!gl)ctx.drawImage(hc,(W-HW)>>1,(H-HH)>>1);
  glDraw();
  requestAnimationFrame(render);
}
let started=false;
function startLoops(){if(started)return;started=true;requestAnimationFrame(render);requestAnimationFrame(loop)}

// ---- WebGL pass: pincushion + chromatic aberration; goggle mode renders side-by-side stereo with per-layer disparity ----
const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D tv,to,th;uniform vec2 sc,vd,hs;uniform float K,C,eye,dw,dh,sp,vg;
vec2 vuv(vec2 u){float k=max(sc.x/vd.x,sc.y/vd.y);vec2 sz=vd*k;return (u*sc-(sc-sz)*.5)/sz;}
vec2 hq(vec2 u){return (u-.5)*hs+.5;}
float inb(vec2 u){return step(0.,u.x)*step(u.x,1.)*step(0.,u.y)*step(u.y,1.);}
void main(){
  vec2 p=v*2.-1.;float r2=dot(p,p);vec2 d=p*(1.-K*r2);
  vec2 q=d*.5+.5,qr=d*(1.+C*r2)*.5+.5,qb=d*(1.-C*r2)*.5+.5;
  vec2 o1=vec2(eye*sp,0.),o2=vec2(eye*(sp+dw),0.),o3=vec2(eye*(sp+dh),0.);
  vec3 col=vec3(texture2D(tv,vuv(qr+o1)).r,texture2D(tv,vuv(q+o1)).g,texture2D(tv,vuv(qb+o1)).b);
  col*=.55;col=(col-.5)*1.1+.5;float gr=dot(col,vec3(.3,.59,.11));col=mix(vec3(gr),col,.85);
  vec4 a=texture2D(to,qr+o2),b=texture2D(to,q+o2),c=texture2D(to,qb+o2);
  col=vec3(col.r*(1.-a.a)+a.r,col.g*(1.-b.a)+b.g,col.b*(1.-c.a)+c.b);
  vec2 h1=hq(qr+o3),h2=hq(q+o3),h3=hq(qb+o3);a=texture2D(th,h1)*inb(h1);b=texture2D(th,h2)*inb(h2);c=texture2D(th,h3)*inb(h3);
  col=vec3(col.r*(1.-a.a)+a.r,col.g*(1.-b.a)+b.g,col.b*(1.-c.a)+c.b);
  col*=1.-vg*.55*smoothstep(.75,1.5,length(p));
  gl_FragColor=vec4(col,1.);
}`;
let gl=null;const U={};
function initGL(){
  try{
    gl=$('gl').getContext('webgl',{alpha:false,antialias:false});
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o};
    const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
    [['tv',0],['to',1],['th',2]].forEach(([n,i])=>{
      gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
      [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(w=>gl.texParameteri(gl.TEXTURE_2D,w,gl.CLAMP_TO_EDGE));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.uniform1i(gl.getUniformLocation(pr,n),i);
    });
    ['sc','vd','hs','K','C','eye','dw','dh','sp','vg'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  }catch(e){gl=null;$('gl').style.display='none';video.style.opacity=1;cv.style.display='block'}
}
function glDraw(){
  if(!gl)return;
  if(video.readyState>=2){gl.activeTexture(gl.TEXTURE0);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video)}
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
  gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.activeTexture(gl.TEXTURE2);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,hc);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.uniform2f(U.sc,W,H);gl.uniform2f(U.vd,video.videoWidth||16,video.videoHeight||9);
  gl.uniform1f(U.K,goggle?GOG_K:LENS_K);gl.uniform1f(U.C,goggle?GOG_CA:CA);
  gl.uniform1f(U.dw,gDepth*.5);gl.uniform1f(U.dh,gDepth);gl.uniform1f(U.sp,gSep);gl.uniform1f(U.vg,goggle?1:0);
  gl.uniform2f(U.hs,W/HW,H/HH);
  (goggle?[-1,1]:[0]).forEach((e,i)=>{gl.viewport(i*EW,0,W,H);gl.uniform1f(U.eye,e);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)});
}
initGL();

// ---- book target: nearest detected book to the screen centre ----
let tgtRaw=null,cur=null,lastSeen=0;
function pickTarget(){
  if(!books.length)return;
  let best=null,bd=1e9;
  books.forEach(b=>{const d=Math.hypot(b.x+b.w/2-W/2,b.y+b.h/2-H/2);if(d<bd){bd=d;best=b}});
  tgtRaw={cx:best.x+best.w/2,cy:best.y+best.h/2,S:Math.max(48,Math.max(best.w,best.h)*1.2)};lastSeen=performance.now();
}
const hasTarget=()=>tgtRaw&&performance.now()-lastSeen<600;
function drawBooks(now){
  if(!hasTarget()){cur=null;return}
  if(!cur)cur={...tgtRaw};else for(const k in tgtRaw)cur[k]+=(tgtRaw[k]-cur[k])*.35;
  const {cx,cy,S}=cur,x0=cx-S/2,y0=cy-S/2;
  drawMarker(cx,cy,S,'MISSION TARGET',1,1);
  if(state===2){
    const y=y0+S*scanP(now);
    ctx.save();ctx.beginPath();ctx.rect(x0,y0,S,S);ctx.clip();
    const g=ctx.createLinearGradient(0,y-30,0,y+30);
    g.addColorStop(0,'rgba(200,255,255,0)');g.addColorStop(.5,'rgba(200,255,255,.9)');g.addColorStop(1,'rgba(200,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x0,y-30,S,60);ctx.restore();
  }
}
function loop(){
  if(video.readyState>=2&&!busy&&state>=1){
    if(mode==='person'&&ready){
      busy=true;seg.send({image:video}).catch(()=>{}).finally(()=>{busy=false});
    }else if(mode==='book'&&cocoModel){
      busy=true;
      cocoModel.detect(video,20,0.15).then(ps=>{
        const r=coverRect(),s=r.w/video.videoWidth;
        books=ps.filter(q=>q.class==='book').map(q=>({x:r.x+q.bbox[0]*s,y:r.y+q.bbox[1]*s,w:q.bbox[2]*s,h:q.bbox[3]*s}));pickTarget();
      }).catch(()=>{}).finally(()=>{busy=false});
    }
  }
  requestAnimationFrame(loop);
}

// ---------- scan sequence ----------
async function runScan(){
  if(!bbox){log('Scan failed. No target in frame.',true);return}
  state=2;scanT0=performance.now();scanEndT=0;cardT0=0;labelT0=0;cardCur=null;
  log('Scanning ID card...');
  await sleep(1400);
  cardT0=performance.now();scanned=true;
  if(Math.random()<.5)log('Illegal activity detected.',true);
  await sleep(600);
  labelT0=performance.now();log('Mission target detected.');
  await sleep(1200);scanEndT=performance.now();
  log('Scan successful.');await sleep(500);
  log('Authenticating...');await sleep(900);
  log('Authentication complete.');await sleep(500);
  log('ID scan complete.');await sleep(600);
  log('Mission update.');await sleep(600);
  log('Start route guide.');await sleep(500);
  log('Ready to scan.');state=1;
}
async function runBookScan(){
  state=2;scanT0=performance.now();scanEndT=0;
  log('Scanning book...');
  await sleep(3200);scanEndT=performance.now();
  if(!hasTarget()){log('Scan failed. No book in frame.',true);state=1;return}
  log('Book scan successful.');await sleep(500);
  log('Reading barcode...');await sleep(900);
  log('Searching inventory...');await sleep(900);
  log('Stock found.');await sleep(600);
  log('Mission update.');await sleep(600);
  log('Start route guide.');await sleep(500);
  log('Ready to scan.');state=1;
}
const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.crossOrigin='anonymous';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function loadBook(){
  log('Loading book detection module...');
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
    cocoModel=await cocoSsd.load({base:'lite_mobilenet_v2'});
    log('Book detection module ready.');return true;
  }catch(e){log('Book detection module offline.',true);return false}
}
async function press(m){
  if(state===2||loading)return;
  if(mode!==m){
    if(m==='person'&&!ready){log('Detection module not ready.',true);return}
    if(m==='book'&&!cocoModel){loading=true;const ok=await loadBook();loading=false;if(!ok)return}
    mode=m;state=1;scanEndT=0;cardT0=labelT0=0;cardCur=null;scanned=false;
    $('bp').classList.toggle('on',m==='person');$('bb').classList.toggle('on',m==='book');
    log(m==='person'?'Target silhouette locked.':'Book detection active.');log('Ready to scan.');
  }else if(state===1){m==='person'?runScan():runBookScan()}
}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'){e.preventDefault();press('person')}
  else if(e.code==='KeyB')press('book');
  else if(e.code==='KeyC')nextCam();
  else if(e.code==='KeyG')setGoggle(!goggle);
  else if(e.code==='BracketRight')adjust('depth',1);else if(e.code==='BracketLeft')adjust('depth',-1);
  else if(e.code==='Period')adjust('sep',1);else if(e.code==='Comma')adjust('sep',-1);
  else if(e.code==='Minus')adjustSize('ui',-1);else if(e.code==='Equal')adjustSize('ui',1);
  else if(e.code==='Digit9')adjustSize('text',-1);else if(e.code==='Digit0')adjustSize('text',1);
});
[['bp','person'],['bb','book']].forEach(([id,m])=>{
  const b=$(id);b.addEventListener('pointerdown',e=>{e.stopPropagation();press(m)});
});
$('bc').addEventListener('pointerdown',e=>{e.stopPropagation();nextCam()});
function setGoggle(on){
  goggle=on;document.body.classList.toggle('gog',on);resize();
  if(on){log('Goggle mode. Swipe up/down: UI depth, left/right: separation.');try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}}
  else log('Goggle mode off.');
}
const saveS=()=>{try{localStorage.setItem('ss',JSON.stringify({gDepth,gSep,uiS,txS}))}catch(e){}};
function adjustSize(k,d){
  if(k==='ui'){uiS=Math.min(1.6,Math.max(.5,Math.round((uiS+d*.1)*10)/10));resize();log(`UI size ${Math.round(uiS*100)}%`)}
  else{txS=Math.min(2,Math.max(.6,Math.round((txS+d*.1)*10)/10));log(`Text size ${Math.round(txS*100)}%`)}
  saveS();
}
function adjust(k,d){
  if(k==='depth')gDepth=Math.min(.03,Math.max(0,gDepth+d*.001));else gSep=Math.min(.1,Math.max(-.1,gSep+d*.002));
  saveS();
  log(k==='depth'?`UI depth ${Math.round(gDepth*1000)}`:`Separation ${Math.round(gSep*500)}`);
}
let sx=0,sy=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;if(!goggle)press('person')});
addEventListener('pointerup',e=>{
  if(!goggle)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dy)>40&&Math.abs(dy)>Math.abs(dx))adjust('depth',dy<0?1:-1);
  else if(Math.abs(dx)>40)adjust('sep',dx>0?1:-1);
  else press('person');
});
$('bg').addEventListener('pointerdown',e=>{e.stopPropagation();setGoggle(!goggle)});
[['u1','ui',-1],['u2','ui',1],['t1','text',-1],['t2','text',1]].forEach(([id,k,d])=>$(id).addEventListener('pointerdown',e=>{e.stopPropagation();adjustSize(k,d)}));


// ---------- camera ----------
let cams=[],camIdx=0;
async function startCam(id){
  if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
  const v={width:{ideal:1280},height:{ideal:720}};
  if(id)v.deviceId={exact:id};else v.facingMode='environment';
  video.srcObject=await navigator.mediaDevices.getUserMedia({video:v,audio:false});
  await video.play();
}
async function listCams(){
  cams=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
}
async function nextCam(){
  if(state===2)return;
  await listCams();
  if(cams.length<2){log('No other camera found.',true);return}
  camIdx=(camIdx+1)%cams.length;
  try{await startCam(cams[camIdx].deviceId);log('Camera: '+(cams[camIdx].label||'#'+camIdx));}
  catch(e){log('Camera switch failed.',true)}
}

// ---------- boot ----------
(async()=>{
  log('System online.');
  try{
    await startCam();await listCams();
    const cur=video.srcObject.getVideoTracks()[0].getSettings().deviceId;
    camIdx=Math.max(0,cams.findIndex(c=>c.deviceId===cur));
    const ip=cams.findIndex(c=>/iphone/i.test(c.label));
    if(ip>=0&&ip!==camIdx){camIdx=ip;await startCam(cams[ip].deviceId)}
    log('Camera linked: '+(cams[camIdx]&&cams[camIdx].label||'default'));
    log(cams.length+' camera(s) found. Press C to switch.');startLoops();
  }catch(e){log('Camera access denied.',true)}
  if(typeof SelfieSegmentation==='undefined'){log('Detection module offline.',true)}
  else{
    log('Loading detection module...');
    try{
      seg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`});
      seg.setOptions({modelSelection:1});seg.onResults(onResults);
      await seg.initialize();ready=true;log('Detection module ready.');log('Space: person / B: book.');
    }catch(e){log('Detection module offline.',true)}
  }
  startLoops();
})();
</script>
